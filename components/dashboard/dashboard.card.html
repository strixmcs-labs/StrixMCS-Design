<!-- @dsCard group="Components" viewport="700x340" name="Dashboard — EntityTile · ModeButton" subtitle="StrixHome tiles and house-mode selectors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin:0; background:var(--bg); padding:26px; font-family:var(--font-sans); }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:0.12em; color:var(--mute); margin-bottom:12px; }
  .block { margin-bottom:24px; }
  .tiles { display:flex; gap:14px; flex-wrap:wrap; }
  .modes { display:flex; gap:12px; max-width:460px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { EntityTile, ModeButton } = window.StrixMCSOrderDesignSystem_72a56f;
    const Icon = ({ n, size=18 }) => {
      const ref = React.useRef(null);
      React.useEffect(() => { if (ref.current && window.lucide) { ref.current.innerHTML=''; const el=document.createElement('i'); el.setAttribute('data-lucide',n); ref.current.appendChild(el); window.lucide.createIcons({attrs:{width:size,height:size,'stroke-width':1.6}}); } });
      return <span ref={ref} style={{display:'inline-flex'}} />;
    };
    function Demo() {
      const [mode, setMode] = React.useState("Night");
      const [lr, setLr] = React.useState(true);
      return (
        <>
          <div className="block">
            <div className="lbl">House mode</div>
            <div className="modes">
              {[["Day","sun"],["Bedtime","moon-star"],["Night","moon"],["Away","door-open"]].map(([m,ic]) => (
                <ModeButton key={m} mode={m} active={mode===m} icon={<Icon n={ic} />} onSelect={()=>setMode(m)} />
              ))}
            </div>
          </div>
          <div className="block">
            <div className="lbl">Entity tiles</div>
            <div className="tiles">
              <EntityTile name="Living room" state={lr?"On · 60%":"Off"} on={lr} icon={<Icon n="lamp" />} onToggle={()=>setLr(!lr)} />
              <EntityTile name="Kitchen" state="Off" on={false} icon={<Icon n="cooking-pot" />} />
              <EntityTile name="Occupancy" state="Occupied" on icon={<Icon n="radar" />} />
              <EntityTile name="Laundry" state="unavailable" unavailable icon={<Icon n="washing-machine" />} />
            </div>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
