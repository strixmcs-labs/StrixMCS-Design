<!-- @dsCard group="Type" viewport="700x210" name="Body / Sans — running prose" subtitle="IBM Plex Sans for anything read at length, 15–16px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); padding:24px 26px; }
  p { font-family:var(--font-sans); font-size:15px; line-height:1.6; color:var(--read); max-width:64ch; margin:0 0 12px; }
  p strong { color:var(--white); font-weight:600; }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--mute); margin-top:12px; letter-spacing:0.06em; }
</style>
</head>
<body>
  <p><strong>StrixHome drives living-room lights from occupancy;</strong> bedtime mode overrides after 23:00. Non-destructive by default — review precedes implementation.</p>
  <p>Weight and size carry hierarchy; the system never reaches for bold as decoration.</p>
  <div class="meta">IBM Plex Sans · 400 regular · 1.6 leading · Read #A8A8A8</div>
</body>
</html>
