<!-- @dsCard group="Brand" viewport="700x200" name="Wordmark — StrixMCS" subtitle="Capital S, lowercase, MCS in capitals. Fixed in every context." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); padding:26px; font-family:var(--font-mono); }
  .wm { font-size:38px; font-weight:600; color:var(--white); letter-spacing:0.005em; }
  .rule { border:1px solid var(--oxblood-hi); border-left:3px solid var(--oxblood-hi); background:var(--oxblood-wash); border-radius:var(--radius); padding:14px 18px; margin-top:20px; }
  .yes { color:var(--gold); font-size:12px; }
  .no { color:var(--mute); font-size:12px; margin-top:8px; font-family:var(--font-sans); }
  .no s { color:var(--faint); }
</style>
</head>
<body>
  <div class="wm">StrixMCS</div>
  <div class="rule">
    <div class="yes">✓ StrixMCS — always</div>
    <div class="no">Never <s>STRIXMCS</s> · <s>strixmcs</s> · <s>Strix MCS</s> · <s>Strixmcs</s></div>
  </div>
</body>
</html>
