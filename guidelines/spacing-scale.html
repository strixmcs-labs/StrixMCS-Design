<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale — 4px base" subtitle="A quiet grid; generous margins" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); padding:24px 26px; font-family:var(--font-mono); }
  .scale { display:flex; align-items:flex-end; gap:14px; }
  .unit { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { width:22px; background:var(--oxblood-hi); border-radius:2px; }
  .n { font-size:10.5px; color:var(--mute); }
</style>
</head>
<body>
  <div class="scale">
    <div class="unit"><div class="bar" style="height:4px"></div><div class="n">4</div></div>
    <div class="unit"><div class="bar" style="height:8px"></div><div class="n">8</div></div>
    <div class="unit"><div class="bar" style="height:12px"></div><div class="n">12</div></div>
    <div class="unit"><div class="bar" style="height:16px"></div><div class="n">16</div></div>
    <div class="unit"><div class="bar" style="height:24px"></div><div class="n">24</div></div>
    <div class="unit"><div class="bar" style="height:32px"></div><div class="n">32</div></div>
    <div class="unit"><div class="bar" style="height:48px"></div><div class="n">48</div></div>
    <div class="unit"><div class="bar" style="height:64px"></div><div class="n">64</div></div>
    <div class="unit"><div class="bar" style="height:80px"></div><div class="n">80</div></div>
  </div>
</body>
</html>
