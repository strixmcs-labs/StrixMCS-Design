<!-- @dsCard group="Colors" viewport="700x200" name="Ceremonial gold — the rarest" subtitle="The motto and the front of formal things. The one exception: the keyboard focus ring." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); font-family:var(--font-mono); padding:20px; }
  .grid { display:grid; grid-template-columns:1fr 1fr 1.6fr; gap:14px; align-items:stretch; }
  .chip { border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .sw { height:64px; }
  .meta { padding:10px 12px; background:var(--near); }
  .name { color:var(--white); font-size:12px; } .hex { color:var(--mute); font-size:11px; margin-top:3px; }
  .motto { border:1px solid var(--oxblood-hi); border-radius:var(--radius); background:var(--near); box-shadow:var(--glow-oxblood); padding:20px 22px; display:flex; flex-direction:column; justify-content:center; }
  .cipher { color:var(--gold-hi); font-size:15px; letter-spacing:var(--ls-motto); }
  .gloss { color:var(--mute); font-size:12px; margin-top:9px; font-family:var(--font-sans); }
</style>
</head>
<body>
  <div class="grid">
    <div class="chip"><div class="sw" style="background:#BCA687"></div><div class="meta"><div class="name">Gold</div><div class="hex">#BCA687</div></div></div>
    <div class="chip"><div class="sw" style="background:#CAB291"></div><div class="meta"><div class="name">Gold&nbsp;(lift)</div><div class="hex">#CAB291</div></div></div>
    <div class="motto"><div class="cipher">Scientia · Societas · Ascensus</div><div class="gloss">Knowledge · Society · Ascent</div></div>
  </div>
</body>
</html>
