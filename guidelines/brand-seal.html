<!-- @dsCard group="Brand" viewport="700x340" name="The seal — one mark" subtitle="Owl over book, white line-art on absolute black. The void is the frame." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:#000; display:flex; align-items:center; justify-content:center; gap:44px; padding:28px; }
  img { width:220px; height:220px; display:block; }
  .note { font-family:var(--font-mono); max-width:240px; }
  .note .k { color:var(--mute); font-size:11px; letter-spacing:0.2em; }
  .note ul { list-style:none; margin:16px 0 0; padding:0; }
  .note li { color:var(--read); font-size:12px; font-family:var(--font-sans); line-height:1.5; padding-left:16px; position:relative; margin-bottom:9px; }
  .note li::before { content:"—"; position:absolute; left:0; color:var(--oxblood-hi); font-family:var(--font-mono); }
</style>
</head>
<body>
  <img src="../assets/StrixMCS-seal-512.png" alt="StrixMCS seal">
  <div class="note">
    <div class="k">The seal</div>
    <ul>
      <li>Owl and book as one figure — never cropped or separated.</li>
      <li>Placed only on absolute black.</li>
      <li>No recolor, rotation, glow, or bevel.</li>
      <li>Clear space equals the height of the owl head.</li>
      <li>Labs uses the same mark, whole — never the head alone.</li>
    </ul>
  </div>
</body>
</html>
