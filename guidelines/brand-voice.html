<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); padding:0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin:20px 26px; }
  .col { padding:18px 20px; }
  .no { background:var(--oxblood-wash); border-left:1px solid var(--line); }
  h4 { font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.16em; margin:0 0 12px; }
  .yes h4 { color:var(--gold); } .no h4 { color:var(--oxblood-hi); }
  p { font-family:var(--font-sans); font-size:12.5px; line-height:1.5; color:var(--read); margin:0 0 10px; }
  .no p { color:var(--mute); }
</style>
</head>
<body>
  <div class="grid">
    <div class="col yes">
      <h4>SOUNDS LIKE THE ORDER</h4>
      <p>"StrixHome drives living-room lights from occupancy; bedtime mode overrides after 23:00."</p>
      <p>"Non-destructive by default. Review precedes implementation."</p>
    </div>
    <div class="col no">
      <h4>NOT THE VOICE</h4>
      <p>"Supercharge your smart home today!! 🚀"</p>
      <p>"Leverage synergies across your IoT ecosystem at scale."</p>
    </div>
  </div>
</body>
</html>
