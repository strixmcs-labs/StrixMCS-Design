<!-- @dsCard group="Type" viewport="700x180" name="Labels & eyebrows — mono, wide tracking, normal case" subtitle="Crest lines, section numbers, config labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--bg); padding:24px 26px; font-family:var(--font-mono); display:flex; flex-direction:column; gap:20px; }
  .crest { font-size:11px; letter-spacing:0.34em; color:var(--gold); }
  .eyebrow { font-size:11px; letter-spacing:0.26em; color:var(--mute); }
  .label { font-size:13px; letter-spacing:0.16em; color:var(--mute); }
  .row { display:flex; align-items:baseline; gap:16px; }
  .tag { font-size:10px; color:var(--faint); letter-spacing:0; }
</style>
</head>
<body>
  <div class="row"><div class="crest">Scientia · Societas · Ascensus</div><div class="tag">crest · 0.34em</div></div>
  <div class="row"><div class="eyebrow">00 — Premise</div><div class="tag">section no · 0.26em</div></div>
  <div class="row"><div class="label">instance: StrixHome</div><div class="tag">label · 0.16em</div></div>
</body>
</html>
